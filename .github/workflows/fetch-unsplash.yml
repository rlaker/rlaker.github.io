name: Fetch Unsplash photos

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch photos from Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        # The quoted heredoc ('PY') stops the shell expanding anything inside,
        # and the API response is never interpolated into source. Pagination
        # happens in one process so no response data round-trips via the shell.
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          PER_PAGE = 30
          key = os.environ["UNSPLASH_ACCESS_KEY"]
          photos = []
          page = 1

          while True:
              url = (
                  "https://api.unsplash.com/users/rlaker/photos"
                  f"?page={page}&per_page={PER_PAGE}&order_by=latest"
              )
              request = urllib.request.Request(
                  url, headers={"Authorization": f"Client-ID {key}"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)

              if not batch:
                  break

              photos += [
                  {
                      "url": p["links"]["html"],
                      "src": p["urls"]["small"],
                      "alt": p.get("alt_description") or "Unsplash photo",
                      "description": p.get("description")
                      or p.get("alt_description")
                      or "",
                  }
                  for p in batch
              ]

              if len(batch) < PER_PAGE:
                  break
              page += 1

          with open("_data/unsplash.json", "w", encoding="utf-8") as f:
              json.dump(photos, f, indent=4)
              f.write("\n")

          print(f"wrote {len(photos)} photos")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/unsplash.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "update Unsplash photo data"
          git push
